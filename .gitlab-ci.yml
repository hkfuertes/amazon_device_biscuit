workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - validate
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  GIT_DEPTH: "1"
  CM12_DEPTH: "1"
  SYNC_JOBS: "4"

.default_docker:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - apk upgrade --no-cache
    - apk add --no-cache bash curl git coreutils findutils tar bzip2 xz p7zip unzip python3
    - docker version

validate:device-tree:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash grep
  script:
    - scripts/validate_device_tree.sh

build:ota:
  extends: .default_docker
  stage: build
  needs: ["validate:device-tree"]
  timeout: 8h
  script:
    - |
      set -euo pipefail
      echo "==> Bootstrap workspace"
      scripts/bootstrap-workspace.sh

      echo "==> Build Docker images"
      docker build -f docker/biscuit-kernel-builder.Dockerfile -t biscuit-kernel-builder:latest docker/
      docker build -f docker/cm12-ubuntu14.Dockerfile -t cm12-ubuntu14:latest docker/

      echo "==> Build kernel"
      scripts/build-kernel.sh

      echo "==> Build OTA"
      scripts/build.sh
      docker logs -f cm12-biscuit-build &
      LOG_PID="$!"
      BUILD_STATUS="$(docker wait cm12-biscuit-build)"
      wait "$LOG_PID" || true
      exit "$BUILD_STATUS"
  after_script:
    - mkdir -p ci-logs
    - docker logs biscuit-kernel-build > ci-logs/biscuit-kernel-build.log 2>&1 || true
    - docker logs cm12-biscuit-build > ci-logs/cm12-biscuit-build.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-logs/
      - workspace/device/amazon/biscuit/prebuilt/kernel-selection.txt
      - workspace/cm12/out-docker/target/product/biscuit/boot.img
      - workspace/cm12/out-docker/target/product/biscuit/system.img
      - workspace/cm12/out-docker/target/product/biscuit/*.zip
