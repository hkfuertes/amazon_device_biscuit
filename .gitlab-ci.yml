workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - validate
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  GIT_DEPTH: "1"
  CM12_STRIP_COMPONENTS: "1"

.default_docker:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - apk add --no-cache bash curl git coreutils findutils tar bzip2 xz p7zip
    - docker version

validate:device-tree:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash grep
  script:
    - scripts/validate_device_tree.sh

build:ota:
  extends: .default_docker
  stage: build
  needs: ["validate:device-tree"]
  timeout: 8h
  script:
    - |
      set -euo pipefail
      : "${BISCUIT_SYSTEM_IMG_URL:?Set BISCUIT_SYSTEM_IMG_URL to a downloadable stock Biscuit system.img}"
      : "${CM12_TARBALL_URL:?Set CM12_TARBALL_URL to a tar archive of a synced/patched CM12 checkout}"

      mkdir -p workspace/downloads workspace/extracted/biscuit-ota workspace/cm12

      echo "==> Download stock Biscuit system.img"
      curl -L --fail --retry 3 -o workspace/extracted/biscuit-ota/system.img "$BISCUIT_SYSTEM_IMG_URL"

      echo "==> Download CM12 checkout archive"
      curl -L --fail --retry 3 -o /tmp/cm12.tar "$CM12_TARBALL_URL"
      tar -xf /tmp/cm12.tar -C workspace/cm12 --strip-components="${CM12_STRIP_COMPONENTS}"

      echo "==> Build Docker images"
      docker build -f docker/biscuit-kernel-builder.Dockerfile -t biscuit-kernel-builder:latest docker/
      docker build -f docker/cm12-ubuntu14.Dockerfile -t cm12-ubuntu14:latest docker/

      echo "==> Prepare stock blobs/vendor"
      scripts/extract-biscuit-stock-blobs.sh workspace/extracted/biscuit-ota/system.img

      echo "==> Build kernel"
      scripts/build-kernel.sh

      echo "==> Build OTA"
      scripts/build.sh
      docker logs -f cm12-biscuit-build &
      LOG_PID="$!"
      BUILD_STATUS="$(docker wait cm12-biscuit-build)"
      wait "$LOG_PID" || true
      exit "$BUILD_STATUS"
  after_script:
    - mkdir -p ci-logs
    - docker logs biscuit-kernel-build > ci-logs/biscuit-kernel-build.log 2>&1 || true
    - docker logs cm12-biscuit-build > ci-logs/cm12-biscuit-build.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-logs/
      - workspace/device/amazon/biscuit/prebuilt/kernel-selection.txt
      - workspace/cm12/out-docker/target/product/biscuit/boot.img
      - workspace/cm12/out-docker/target/product/biscuit/system.img
      - workspace/cm12/out-docker/target/product/biscuit/*.zip
